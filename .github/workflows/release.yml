name: Release strategy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Strategy release tag"
        default: "strategy-v1"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install zstandard
      - run: node tools/export-strategy.mjs
        env:
          KYOuen_TAG: ${{ inputs.tag }}
      - run: python tools/verify-strategy.py .strategy-work/kyouen-9x9.cert.zst .strategy
      - run: gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "Proven 9x9 strategy: 8826458 WIN records in 256 shards. See docs/provenance.md." .strategy/manifest.json .strategy/*.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
