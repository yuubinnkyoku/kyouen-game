name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch strategy bundle (single asset, then extract)
        run: |
          mkdir -p .strategy
          gh release download strategy-v1 -R yuubinnkyoku/kyouen-game --clobber --dir .strategy --pattern '*.tar.gz'
          tar -xzf .strategy/.strategy-bundle.tar.gz -C .strategy --strip-components=1
          ls .strategy | head -5
          test -f .strategy/manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          KYOuen_TAG: strategy-v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
