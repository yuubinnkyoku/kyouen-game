name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install zstandard
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Build strategy shards
        run: node tools/export-strategy.mjs
        env:
          KYOuen_TAG: strategy-v1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify strategy
        run: python tools/verify-strategy.py .strategy-work/kyouen-9x9.cert.zst .strategy
      - run: npm run test:integration
      - run: npm run build
