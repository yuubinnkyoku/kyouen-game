name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Fetch strategy shards (pinned strategy-v1 release)
        run: node tools/fetch-strategy.mjs
        env:
          KYOuen_TAG: strategy-v1
      - run: npm run test:integration
      - run: npm run build
        env:
          KYOuen_TAG: strategy-v1
